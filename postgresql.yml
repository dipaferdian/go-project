services:
  postgres:
    image: postgres:14
    container_name: go-project
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_backend

    ports:
      - "5433:5432"

    volumes:
      - postgres14_data:/var/lib/postgresql/data

    networks:
      - postgres_network

volumes:
  postgres14_data:

networks:
  postgres_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
